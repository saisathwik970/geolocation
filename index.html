<html>
<head>
  <title>Geolocation Tracking</title>
</head>
<body>
  <h1>Geolocation Tracking</h1>
  <p id="location">Loading...</p>

  <script>
    // Get the target location
    function getLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(position) {
          var lat = position.coords.latitude;
          var lon = position.coords.longitude;

          // Send location to your server
          var xhr = new XMLHttpRequest();
          xhr.open('POST', 'https://your-server-url.com/save-location', true);
          xhr.setRequestHeader('Content-Type', 'application/json');
          xhr.send(JSON.stringify({ latitude: lat, longitude: lon }));

          // Show the location on your page
          document.getElementById('location').innerHTML = 'Latitude: ' + lat + ', Longitude: ' + lon;
        });
      } else {
        document.getElementById('location').innerHTML = 'Geolocation not supported';
      }
    }

    // Call the function
    getLocation();
  </script>
</body>
</html>
